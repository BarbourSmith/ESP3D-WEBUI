<div id="controlPanel" class="panel panel-default panel-flex-col panel-min-width hide_it">
    <div class="panel-heading ">
        <div class="row ">
            <div class="col-md-12">
                <div class="pull-left">
                    <b><span translate>Controls</span></b>
                </div>
                <div class="pull-right">
                    <div id="auto_check_control" class="panel-flex-row">
                        <table class="checkbox">
                            <tr>
                                <td>&nbsp;&nbsp;</td>
                                <td>
                                    <label>
                                        <input id="autocheck_position" type="checkbox"/>
                                        <span translate>auto-check position every:</span>
                                    </label>
                                </td>
                            </tr>
                        </table>
                        <table class="input-group">
                            <tr>
                                <td>
                                    <input id="controlpanel_interval_positions" class="form-control w4" type="number"
                                        min="1" max="99" step="any"/>
                                    <span class="input-group-addon form_control" translate>sec</span>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="control-body" class="panel-body panel-flex-main">
        <div class="row">
            <div id="JogUI" class="col col-md-7 col-lg-7">

            <div class="col col-lg-4 ">

            </div>
            <div class="col">
                &nbsp;
            </div>
        </div>
        <div>
            <button id="zero_xyz_btn" class="btn btn-xs btn-default">&Oslash;<span id="zero_xyz_btn_txt" style="font-size:8px;">XYZ</span>
            </button>
        </div><br>
        <div id="positions_labels" class="position-container">
            <div class="position_text">
                <table>
                    <tr>
                        <td>
                            <button id="zero_x_btn" class="btn btn-xs btn-default">&Oslash;</button>
                        </td>

                            <span class="label label-default" style="padding: 5px 5px 3px 5px;">
                                <span id="control_x_position_label">X</span>:<span id="control_x_position">&nbsp;</span>
                            </span>
                        </td>
                        <td>
                        </td>
                    </tr>
                    <tr id="control_xm_position_row">
                        <td></td>
                        <td>

                                </tr>
